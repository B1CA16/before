[project]
name = "before-api"
version = "0.0.0"
description = "beFORE API: serves spots and BeFORE scores."
requires-python = ">=3.12"
dependencies = [
    "before-surf",
    "fastapi[standard]",
]

[tool.uv.sources]
before-surf = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/before_api"]
