[project]
name = "before-api"
version = "0.0.0"
description = "beFORE API: serves spots and BeFORE scores."
requires-python = ">=3.12"
dependencies = [
    "before-surf",
    "fastapi[standard]",
    # A pool, not a nicety. Supabase's session-mode pooler caps us at 15 clients, and opening a fresh
    # connection per request exhausted that the moment anything concurrent happened.
    "psycopg-pool>=3.2.0",
    # [crypto] pulls in `cryptography`, needed for ES256. Supabase signs with an elliptic-curve key,
    # not a shared secret, so we verify against its published public key.
    "pyjwt[crypto]>=2.10.1",
]

[tool.uv.sources]
before-surf = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/before_api"]
