[tool.uv.workspace]
members = ["ml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["ml/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["before_surf"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.2",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "seaborn>=0.13.2",
]
