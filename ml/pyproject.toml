[project]
name = "before-surf"
version = "0.0.0"
description = "beFORE Surf Intelligence: data, features, and scoring."
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/before_surf"]
